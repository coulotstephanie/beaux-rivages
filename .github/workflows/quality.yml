name: Beaux Rivages — contrôle qualité

on:
  push:
    branches: [main, release/v1-hosting]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm install
      - name: Vérifier TypeScript
        run: npm run lint
      - name: Compiler le site
        run: npm run build
